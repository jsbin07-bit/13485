<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="의료기기 품질경영시스템 ISO 13485:2016 인증의 의미, 필요성, 주요 요구사항과 준비 절차를 안내합니다.">
  <title>ISO 13485 | 의료기기 품질경영시스템</title>
  <style>
    :root {
      --navy: #102b46;
      --blue: #1769aa;
      --teal: #17a69a;
      --ink: #1d2b38;
      --muted: #627386;
      --pale: #f3f8fb;
      --line: #dce6ed;
      --white: #fff;
      --shadow: 0 16px 42px rgba(16, 43, 70, .10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo",
                   "Malgun Gothic", sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; }
    .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--navy);
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -.03em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      border-radius: 12px;
      font-size: 19px;
    }
    .nav-links { display: flex; gap: 25px; align-items: center; }
    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }
    .nav-links a:hover { color: var(--blue); }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: var(--white);
      font-weight: 750;
      text-decoration: none;
      transition: transform .2s, background .2s;
    }
    .button:hover { background: #0e548d; transform: translateY(-2px); }
    .button.secondary {
      color: var(--navy);
      background: var(--white);
      border: 1px solid var(--line);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 88px 0 82px;
      color: var(--white);
      background:
        radial-gradient(circle at 82% 25%, rgba(23,166,154,.25), transparent 28%),
        linear-gradient(120deg, #102b46, #164f78 68%, #167a86);
    }
    .hero:after {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      right: -120px;
      bottom: -250px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50%;
      box-shadow: 0 0 0 48px rgba(255,255,255,.035),
                  0 0 0 100px rgba(255,255,255,.025);
    }
    .hero-content { position: relative; z-index: 1; max-width: 760px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: #a9e8e1;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow:before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--teal);
    }
    h1 {
      max-width: 760px;
      margin: 0 0 20px;
      font-size: clamp(36px, 5vw, 58px);
      line-height: 1.18;
      letter-spacing: -.045em;
    }
    .hero p {
      max-width: 680px;
      margin: 0 0 30px;
      color: #d5e4ed;
      font-size: 17px;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero .button { background: var(--teal); }
    .hero .button:hover { background: #108d83; }
    .hero .button.secondary {
      color: var(--white);
      background: transparent;
      border-color: rgba(255,255,255,.45);
    }
    .hero-note { margin-top: 24px !important; color: #b7cbd8 !important; font-size: 12px !important; }

    .facts { margin-top: -28px; position: relative; z-index: 2; }
    .fact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .fact {
      padding: 24px 28px;
      border-right: 1px solid var(--line);
    }
    .fact:last-child { border-right: 0; }
    .fact strong { display: block; color: var(--navy); font-size: 20px; }
    .fact span { color: var(--muted); font-size: 13px; }

    section { padding: 82px 0; }
    section.soft { background: var(--pale); }
    .section-heading { max-width: 720px; margin-bottom: 36px; }
    .section-heading .eyebrow { color: var(--blue); }
    h2 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: clamp(28px, 3.5vw, 40px);
      line-height: 1.25;
      letter-spacing: -.035em;
    }
    .section-heading p { margin: 0; color: var(--muted); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card {
      padding: 25px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .card-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 17px;
      color: var(--blue);
      background: #eaf4fb;
      border-radius: 14px;
      font-size: 21px;
    }
    .card h3 { margin: 0 0 9px; color: var(--navy); font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
