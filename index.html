<!-- ... existing code ... -->
            <!-- Submit Button & Result -->
            <div class="pt-8 border-t border-slate-200 text-center">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-xl transition duration-200 text-lg shadow-lg">
                    답안 제출 및 채점하기
                </button>
                <div id="resultBox" class="mt-8 hidden p-6 rounded-xl text-xl font-bold"></div>
            </div>
        </form>
    </div>

    <script>
        const mcqQuestions = [
            {
                q: "ISO 13485의 주요 목적은?",
                opts: ["직원 복지 향상", "고객 및 규제 요구사항 지속 충족", "생산 비용 최적화", "마케팅 전략 수립"],
                ans: 1
            },
            {
                q: "품질매뉴얼 필수 포함 항목은?",
                opts: ["회사의 재무 상태표", "마케팅 부서의 조직도", "적용 제외의 정당성", "모든 직원의 급여 명세서"],
                ans: 2
            },
            {
                q: "기록 최소 보관 기간은?",
                opts: ["1년", "출고일로부터 2년 또는 기기 수명 중 긴 기간", "5년", "영구 보관"],
                ans: 1
            },
            {
                q: "멸균의료기기 포장 시 요구사항은?",
                opts: ["미생물/미립자 오염관리 및 청결 유지", "가장 저렴한 포장재 사용", "화려한 디자인 적용", "외부 업체의 기본 포장 그대로 사용"],
                ans: 0
            },
            {
                q: "설계/개발 입력 필수 사항은?",
                opts: ["기능/성능/안전 요구사항", "경쟁사의 영업 기밀", "제품의 최종 판매 가격", "광고 모델 계약 조건"],
                ans: 0
            },
            {
                q: "설계 유효성 확인 완료 시점은?",
                opts: ["제품 판매 후 1년 이내", "고객에게 출고 전", "경쟁사 제품 출시 전", "초도 물량 폐기 후"],
                ans: 1
            },
            {
                q: "공급자 평가 기준이 아닌 것은?",
                opts: ["조직 요구사항 충족 능력", "공급자의 성과", "구매품이 의료기기에 미치는 영향", "공급자의 영업 이익률"],
                ans: 3
            },
            {
                q: "공정 유효성 확인이 필수인 경우는?",
                opts: ["육안으로 100% 검사가 가능한 경우", "결과물을 후속 측정으로 검증할 수 없는 경우", "포장 박스 색상을 변경하는 경우", "단순한 라벨 부착 공정인 경우"],
                ans: 1
            },
            {
                q: "인도 후 부적합 발견 시 조치는?",
                opts: ["부적합의 영향에 비례한 적절한 조치", "조건 없이 무조건적인 환불", "경쟁사 제품으로 교환", "조치 없이 자체 폐기"],
                ans: 0
            },
            {
                q: "시정조치의 목적은?",
                opts: ["잠재적 부적합 발생 방지", "부적합 제품의 임시 사용 허가", "재발 방지를 위한 원인 제거", "고객의 단순 변심 해결"],
                ans: 2
            }
        ];

        const subQuestions = [
            {
                q: "위험(Risk)의 정의를 기재하시오.",
                ans: "위해의 발생 가능성과 그 위해의 심각성의 조합"
            },
            {
                q: "내부감사의 목적을 서술하시오.",
                ans: "품질경영시스템이 요구사항에 적합하며 효과적으로 실행되고 유지되는지 결정하기 위함"
            },
            {
                q: "멸균 공정 필수 유지 기록을 서술하시오.",
                ans: "각 멸균 배치(batch)에 사용된 멸균 공정 매개변수(parameter) 기록"
            },
            {
                q: "시정조치와 예방조치의 차이를 '발생시점' 기준으로 서술하시오.",
                ans: "시정조치는 이미 발생한 부적합의 재발을 방지하는 것이며, 예방조치는 잠재적 부적합(아직 발생하지 않음)의 발생을 방지하는 것이다."
            },
            {
                q: "멸균포장시스템의 정의를 서술하시오.",
                ans: "미생물의 침입을 방지하고 사용 시점에 제품이 무균상태로 제공되도록 하는 최소의 포장"
            }
        ];

        // 렌더링
        const mcqContainer = document.getElementById('mcqContainer');
        mcqQuestions.forEach((item, index) => {
            let optionsHTML = '';
            item.opts.forEach((opt, optIndex) => {
                optionsHTML += `
                    <label class="block relative cursor-pointer group">
                        <input type="radio" name="mcq_${index}" value="${optIndex}" class="radio-custom absolute opacity-0 w-0 h-0" required>
                        <div class="flex items-center p-4 border-2 border-slate-200 rounded-xl transition group-hover:border-blue-300">
                            <div class="circle w-5 h-5 border-2 border-slate-300 rounded-full mr-4 flex-shrink-0 transition flex items-center justify-center">
                                <div class="w-2.5 h-2.5 bg-white rounded-full"></div>
                            </div>
                            <span class="text-slate-700">${opt}</span>
                        </div>
                    </label>
                `;
            });
            mcqContainer.innerHTML += `
                <div class="bg-slate-50 p-6 rounded-xl question-block" data-type="mcq" data-index="${index}">
                    <p class="font-bold text-lg mb-4 text-slate-900"><span class="text-blue-600 mr-2">Q${index + 1}.</span> ${item.q}</p>
                    <div class="space-y-3 pl-2">${optionsHTML}</div>
                    <div class="feedback mt-4 text-sm font-bold hidden"></div>
                </div>
            `;
        });

        const subContainer = document.getElementById('subContainer');
        subQuestions.forEach((item, index) => {
            subContainer.innerHTML += `
                <div class="bg-slate-50 p-6 rounded-xl question-block" data-type="sub" data-index="${index}">
                    <p class="font-bold text-lg mb-4 text-slate-900"><span class="text-orange-600 mr-2">Q${index + 11}.</span> ${item.q}</p>
                    <textarea name="sub_${index}" rows="2" class="w-full p-4 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition resize-none" placeholder="답안을 서술하세요" required></textarea>
                    <div class="feedback mt-4 text-[15px] p-4 rounded-lg hidden leading-relaxed"></div>
                </div>
            `;
        });

        // 채점 로직
        document.getElementById('evaluationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let mcqScore = 0;

            // MCQ 채점
            mcqQuestions.forEach((item, index) => {
                const block = document.querySelector(`.question-block[data-type="mcq"][data-index="${index}"]`);
                const selected = parseInt(document.querySelector(`input[name="mcq_${index}"]:checked`).value);
                const feedback = block.querySelector('.feedback');
                
                feedback.classList.remove('hidden', 'text-green-600', 'text-red-600');
                if (selected === item.ans) {
                    mcqScore++;
                    block.classList.add('border', 'border-green-300', 'bg-green-50');
                    feedback.classList.add('text-green-600');
                    feedback.textContent = "정답입니다!";
                } else {
                    block.classList.add('border', 'border-red-300', 'bg-red-50');
                    feedback.classList.add('text-red-600');
                    feedback.textContent = `오답입니다. 정답: ${item.opts[item.ans]}`;
                }
            });

            // 단답형/주관식 채점 (모범답안 표시)
            subQuestions.forEach((item, index) => {
                const block = document.querySelector(`.question-block[data-type="sub"][data-index="${index}"]`);
                const feedback = block.querySelector('.feedback');
                
                feedback.classList.remove('hidden');
                block.classList.add('border', 'border-blue-300', 'bg-blue-50/50');
                feedback.classList.add('bg-blue-100', 'text-blue-800');
                feedback.innerHTML = `<span class="font-black mr-2">💡 모범 답안:</span> ${item.ans}`;
            });

            // 결과 출력 (객관식 점수 기준)
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            const mcqTotal = mcqQuestions.length;
            const percentage = (mcqScore / mcqTotal) * 100;
            
            if (percentage >= 80) {
                resultBox.classList.add('bg-green-100', 'text-green-800');
                resultBox.innerHTML = `🎉 객관식 평가 합격입니다! (${mcqTotal}문제 중 ${mcqScore}문제 정답, ${percentage.toFixed(0)}점)<br><span class="text-sm font-medium mt-3 block text-green-700">주관식 문항은 위 표시된 모범답안과 본인의 작성 답안을 비교하여 자체 점검하시기 바랍니다.</span>`;
            } else {
                resultBox.classList.add('bg-red-100', 'text-red-800');
                resultBox.innerHTML = `⚠️ 객관식 평가 재교육이 필요합니다. (${mcqTotal}문제 중 ${mcqScore}문제 정답, ${percentage.toFixed(0)}점 / 합격기준 80점)<br><span class="text-sm font-medium mt-3 block text-red-700">규격서 재학습을 권장합니다. 주관식 모범답안도 함께 확인해주세요.</span>`;
            }
            
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    </script>

</body></html>
